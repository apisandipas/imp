[workspace]
resolver = "2"
members = ["crates/imp-core", "crates/imp-server", "crates/imp"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
imp-core = { path = "crates/imp-core" }
imp-server = { path = "crates/imp-server" }
ropey = "1.6.1"
crossterm = "0.29.0"
steel = { package = "steel-core", version = "0.8.3" }
regex = "1"
ignore = "0.4"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-scheme = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-nix = "0.3"
tree-sitter-md = "0.5"

# Steel's prelude takes ~1s to load in a debug build, and every test starts a
# server. Optimizing dependencies (not our own crates) keeps tests fast while
# leaving our code quick to rebuild and easy to debug.
[profile.dev.package."*"]
opt-level = 2
