[workspace]
resolver = "2"
members = ["crates/imp-core", "crates/imp-server", "crates/imp", "crates/imp-gui"]
# Built on its own, for wasm32-unknown-unknown.
exclude = ["examples/wasm-plugin"]

[workspace.package]
version = "0.1.0-alpha.5"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/apisandipas/imp"

[workspace.dependencies]
imp-core = { path = "crates/imp-core" }
imp-server = { path = "crates/imp-server" }
imp-gui = { path = "crates/imp-gui" }
ropey = "1.6.1"
crossterm = "0.29.0"
steel = { package = "steel-core", version = "0.8.3" }
regex = "1"
ignore = "0.4"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-scheme = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-nix = "0.3"
tree-sitter-md = "0.5"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-lua = "0.5"
wasmtime = { version = "38", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }
yrs = "0.28"
base64 = "0.22"
kdl = { version = "6", default-features = false, features = ["span"] }
vt100 = "0.17"
portable-pty = "0.9"
libc = "0.2"

# Steel's prelude takes ~1s to load in a debug build, and every test starts a
# server. Optimizing dependencies (not our own crates) keeps tests fast while
# leaving our code quick to rebuild and easy to debug.
[profile.dev.package."*"]
opt-level = 2
debug = false

# Each test file is its own binary linking the whole editor, so debug info
# multiplies fast (a full set with it took 160 GB over two days of builds).
# Line tables are enough for backtraces.
[profile.dev]
debug = "line-tables-only"
