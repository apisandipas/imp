[package]
name = "imp-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "imp"
path = "src/main.rs"

[dependencies]
imp-core.workspace = true
imp-server.workspace = true
crossterm.workspace = true
imp-gui = { workspace = true, optional = true }

[features]
default = ["gui"]
# The window client. Without it (--no-default-features) imp is terminal
# only, with no graphics dependencies.
gui = ["dep:imp-gui"]
# Phase 5 prototypes.
wasm = ["imp-server/wasm"]
crdt = ["imp-server/crdt"]
kdl = ["imp-server/kdl"]
