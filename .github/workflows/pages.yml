# The website (site/) on GitHub Pages, published on every push to main
# that changes it. The docs section, site/docs/, is built first from
# docs/guide and docs/reference by tools/site-docs.py.
name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, docs/guide/**, docs/reference/**, tools/site-docs.py, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: python3 tools/site-docs.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
