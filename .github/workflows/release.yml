# Pushing a tag like v0.1.0 or v0.1.0-alpha.1 makes a GitHub release (a
# prerelease when the tag has a "-") and attaches a binary per platform.
name: Release

on:
  push:
    tags: ["v*"]

# Only the publish job can write: the builds run every dependency's build
# script, so they get a read-only token.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The version ci.yml and flake.lock use; bump them together.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: "1.98.1"
      - name: Build
        run: cargo build --release --locked -p imp-editor
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          name="imp-$TAG-$TARGET"
          mkdir "$name"
          cp target/release/imp README.md LICENSE "$name/"
          case "$TARGET" in
            *linux*) cp assets/imp.desktop assets/imp.svg "$name/" ;;
          esac
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: imp-${{ matrix.target }}
          path: imp-*.tar.gz*
          if-no-files-found: error

  # The release is made only once every platform has built, so a failed
  # build leaves no half-filled release behind.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Create the release and attach the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --title "imp $TAG" --generate-notes $prerelease dist/*
