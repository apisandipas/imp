# Tests, clippy and fmt on every push and pull request, with the toolchain
# pinned by flake.lock (tools/check.sh), and the Nix package build.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Debug builds of every feature (wasmtime, wgpu) with debug info
      # outgrow the runner's disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: tools/check.sh
      - run: df -h /
        if: always()

  # The same checks without Nix, as someone with rustup builds imp:
  # check.sh falls back to the cargo on PATH.
  check-without-nix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      # The version flake.lock pins, so new lints in a later Rust don't
      # fail this job alone; bump it with flake.lock.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
      # What the README asks for besides Rust; git and python3 are there.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-rustup-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-rustup-${{ runner.os }}-
      - run: tools/check.sh
      - run: df -h /
        if: always()

  nix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build -L .#default
      - run: ./result/bin/imp --version
