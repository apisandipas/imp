# Tests, clippy and fmt on every push and pull request, with the toolchain
# pinned by flake.lock (tools/check.sh), the Nix package build, and the
# notes and docs checks.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The notes and the user reference: lore check (links, citations, and
  # notes or pages frozen against a spec that has changed since) and
  # site-docs.py --check, which also reports a page's drift when lore is
  # on PATH.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A lore release's Linux binary, checked against the hash in that
      # release's SHA256SUMS; bump both together.
      LORE_VERSION: v0.1.0-alpha.5
      LORE_SHA256: c0ac576ffe3dafc5dc89e9f8760f177eceba9696f7727eee9e648f1cd48a5671
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # lore searches the code with ripgrep.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install lore
        run: |
          curl -fsSL -o lore.tar.gz "https://github.com/apisandipas/lore/releases/download/$LORE_VERSION/lore-linux-x64.tar.gz"
          echo "$LORE_SHA256  lore.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf lore.tar.gz -C "$HOME/.local/bin" lore
          rm lore.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: lore check
      - run: python3 tools/site-docs.py --check

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Debug builds of every feature (wasmtime, wgpu) with debug info
      # outgrow the runner's disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: tools/check.sh
      - run: df -h /
        if: always()

  # The same checks without Nix, as someone with rustup builds imp:
  # check.sh falls back to the cargo on PATH.
  check-without-nix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The version flake.lock pins, so new lints in a later Rust don't
      # fail this job alone; bump it with flake.lock.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
      # What the README asks for besides Rust; git and python3 are there.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-rustup-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-rustup-${{ runner.os }}-
      - run: tools/check.sh
      - run: df -h /
        if: always()

  nix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix build -L .#default
      - run: ./result/bin/imp --version
