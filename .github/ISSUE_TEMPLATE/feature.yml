name: Feature or change
description: Something imp should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's hard, slow or missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change.
    validations:
      required: true
  - type: textarea
    id: precedent
    attributes:
      label: Precedent
      description: How Vim, Emacs or their packages (Magit, Org, ...) handle this, if they do.
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this covers, and what it leaves for later.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The checks that show it works.
      placeholder: |
        - [ ] ...
